name: ScoutPro Scheduler

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  resumen:
    if: github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Resumen del dia
        run: curl -s --max-time 280 "${{ secrets.VERCEL_URL }}/api/resumen-diario" || true

  analisis:
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Analisis de partidos
        run: curl -s --max-time 280 "${{ secrets.VERCEL_URL }}/api/analisis-ia" || true
      - name: Surebets
        run: curl -s --max-time 120 "${{ secrets.VERCEL_URL }}/api/apuestas-seguras" || true
